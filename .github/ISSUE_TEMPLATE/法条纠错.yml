name: 法条纠错
description: 条文文字、条号、时效、分类有问题
title: "[纠错] "
body:
  - type: markdown
    attributes:
      value: |
        一个条文错字，可能让律师在文书里引错原文。请务必给出**官方原文对照**——
        没有对照的报错无法处理，不是不信任你，是这样才能确认改哪儿。

  - type: input
    id: law_name
    attributes:
      label: 法规全名
      description: 写书名号里的全称；库内简称与全名是同一部，但全名更省事
      placeholder: 中华人民共和国劳动合同法
    validations:
      required: true

  - type: input
    id: article
    attributes:
      label: 条号
      description: 增补条写成「第一百三十三条之一」
      placeholder: 第八十二条
    validations:
      required: true

  - type: dropdown
    id: issue_type
    attributes:
      label: 问题类型
      options:
        - 文字错漏
        - 条号错位
        - 缺失条文
        - 时效性有误（该失效的没失效，或反之）
        - 分类归属错
        - 版本不对（库内不是最新版）
        - 其他
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 库里现在是什么
      description: 从本地查询界面或 MCP 复制出来，保留原样，不要顺手改
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 官方原文是什么
      description: 从国家法律法规数据库逐字复制
      render: text
    validations:
      required: true

  - type: input
    id: official_url
    attributes:
      label: 官方页面链接
      placeholder: https://flk.npc.gov.cn/detail2.html?...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 截图
      description: 官方页面截图，可直接拖拽上传

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 官方原文是逐字复制的，没有自行修正标点或错字
          required: true
        - label: 我核对过本地数据版本（查询界面底部有版本号），确认不是库太旧导致的
          required: false
